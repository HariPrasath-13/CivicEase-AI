version: '3.8'

services:
  civicease-ui:
    build: .
    container_name: civicease-streamlit-ui
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  civicease-api:
    build: .
    container_name: civicease-fastapi-api
    command: ["uvicorn", "api:api_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
